{% extends "base.html" %}
{% set page = "landing" %}
{% block title %}{{ job.name }} · YuE2 Studio{% endblock %}
{% block body %}
<main class="layout layout-browse" id="layout">
  <section class="panel panel-library">
    <div id="library" sse-swap="library" hx-get="/partials/library" hx-trigger="library-changed from:body">
      {% include "partials/library.html" %}
    </div>
  </section>

  <section class="panel panel-queue">
    <div id="queue" sse-swap="queue" hx-get="/partials/queue" hx-trigger="queue-changed from:body">
      {% include "partials/queue.html" %}
    </div>
  </section>

  <section class="panel panel-detail">
    <div id="detail">
      {% include "partials/job_detail.html" %}
    </div>
  </section>
</main>
{% endblock %}
